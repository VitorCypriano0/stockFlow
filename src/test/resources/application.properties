# O teste de contexto usa um banco temporário e uma chave sem uso fora dos testes.
spring.datasource.url=jdbc:h2:mem:stockflow-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=stockflow-test-key-with-more-than-32-bytes
