spring.application.name=stockflow
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cafeteria}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.config.import=optional:file:.env[.properties]
spring.secretkey=${JWT_SECRET}
spring.tempo_expiracao=${JWT_EXPIRATION_MINUTES:60}
app.bootstrap.key=${APP_BOOTSTRAP_KEY:}
